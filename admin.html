<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="robots" content="noindex">
<title>Budget Admin-Center</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f4f6f5; --card: #fff; --text: #1d2422; --muted: #66706d; --line: #e1e6e4;
  --brand: #1f6f5c; --brand-soft: #e3f1ec; --ok: #2e8b57; --warn: #c98a00; --bad: #c0392b;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --card: #1c2220; --text: #e8eeec; --muted: #9aa5a1; --line: #2c3431;
    --brand: #4fb79a; --brand-soft: #1d332c; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--brand); color: #fff; }
.top button { background: none; border: 0; color: #fff; cursor: pointer; }
.mandant { font-weight: 600; max-width: 40%; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.15) !important; }
.monat { flex: 1; white-space: nowrap; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
.monat button { font-size: 26px; padding: 0 10px; line-height: 1; }
.sync { font-size: 20px; padding: 6px 10px; }
.sync.dirty::after { content: "•"; color: #ffd166; margin-left: 2px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 10px; font-size: 11px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tabs button span { font-size: 20px; line-height: 1.1; }
.tabs button.on { color: var(--brand); font-weight: 600; }
.tabs .plus span { background: var(--brand); color: #fff; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; font-size: 26px; margin-top: -14px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }

.card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05); border: 1px solid var(--line); }
h2 { font-size: 18px; margin: 4px 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.big { font-size: 26px; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pos { color: var(--ok); } .neg { color: var(--bad); }

.bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li.click { cursor: pointer; }

.btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--brand); color: #fff;
  font-weight: 600; cursor: pointer; }
.btn.sec { background: var(--brand-soft); color: var(--brand); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 14px; }
.btn.full { width: 100%; padding: 14px; font-size: 17px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); }
input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 4px; border-top: 1px solid var(--line); }
th { text-align: left; color: var(--muted); font-weight: 600; border-top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sum td { font-weight: 700; border-top: 2px solid var(--text); }
tr.click { cursor: pointer; }
.tablewrap { overflow-x: auto; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.chart { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.chart .bars { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.chart .b { width: 40%; border-radius: 3px 3px 0 0; min-height: 1px; }
.chart .b.soll { background: var(--line); } .chart .b.ist { background: var(--brand); }
.chart .b.ist.over { background: var(--bad); }
.chart small { font-size: 10px; color: var(--muted); margin-top: 3px; }

#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff;
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  max-width: 90vw; text-align: center; }
#toast.show { opacity: .95; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
.empty { text-align: center; color: var(--muted); padding: 20px 0; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }

.belegbox { margin: 4px 0 6px; }
.belegbox label.btn { display: inline-block; color: var(--brand); margin: 0; font-size: 15px; }
.belegthumb { display: block; max-width: 100%; max-height: 220px; margin: 10px 0 4px; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
#belegStatus { margin-top: 4px; }
a.btn { text-decoration: none; display: inline-block; }

.installbar { position: fixed; left: 8px; right: 8px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 8; background: var(--card);
  border: 1px solid var(--brand); border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; max-width: 560px; margin: 0 auto; }
.schritte li { margin: 6px 0; }

#belegVorschau #zuschnitt { display: block; margin-bottom: 6px; }
.crop { position: relative; touch-action: none; user-select: none; line-height: 0; }
.crop img { width: 100%; height: auto; display: block; }
.cropbox { position: absolute; border: 2px solid var(--brand); box-shadow: 0 0 0 9999px rgba(0,0,0,.45); cursor: move; touch-action: none; }
.cropbox i { position: absolute; width: 26px; height: 26px; background: #fff; border: 3px solid var(--brand); border-radius: 50%; }
.cropbox i[data-e=nw] { left: -13px; top: -13px; cursor: nwse-resize; } .cropbox i[data-e=ne] { right: -13px; top: -13px; cursor: nesw-resize; }
.cropbox i[data-e=sw] { left: -13px; bottom: -13px; cursor: nesw-resize; } .cropbox i[data-e=se] { right: -13px; bottom: -13px; cursor: nwse-resize; }
.crop { overflow: hidden; border-radius: 8px; }
.teilbox { margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.teilbox h3 { margin: 0 0 4px; }
.teil { display: grid; grid-template-columns: 1fr 90px auto; gap: 6px; align-items: center; margin: 6px 0; }
.teil select, .teil input { margin: 0; }
.teil .tT { grid-column: 1 / -1; font-size: 12px; margin-top: -2px; }
.frage { margin-top: 10px; padding: 10px; border-radius: 10px; background: #fff3d6; color: #5a4300; }
.warnkarte { background: #fff3d6; border-color: #f0d48a; color: #5a4300; }
.warnkarte p { margin: 6px 0 0; }
.playknopf { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; flex: none; margin-right: 10px; }

.admin-wide main { max-width: 1100px; }
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.kacheln .card { margin: 0; }
.personen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill.aus { background: #fde8e6; color: var(--bad); }
.pill.warnp { background: #fff3d6; color: var(--warn); }
.qr svg { width: 100%; max-width: 260px; height: auto; display: block; margin: 8px auto; background: #fff; padding: 8px; border-radius: 10px; }
.link { word-break: break-all; font-size: 12px; background: var(--bg); padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
.schritte li { margin: 6px 0; }
.filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
td.klein, th.klein { font-size: 12px; color: var(--muted); }
</style>
</head>
<body class="admin-wide">
<header class="top">
  <strong style="flex:1">Admin-Center</strong>
  <span id="wer" class="muted" style="color:#fff;opacity:.85;font-size:14px"></span>
  <button id="reload" class="sync" title="Neu laden">⟳</button>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="uebersicht" class="on"><span>▦</span>Übersicht</button>
  <button data-tab="neu"><span>+</span>Neue Buchhaltung</button>
  <button data-tab="protokoll"><span>☰</span>Protokoll</button>
  <button data-tab="einstellungen"><span>⚙</span>Admin-Schlüssel</button>
</nav>
<div id="toast" role="status"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);

<script>
'use strict';
/* Admin-Center der Budget-App
   Übersicht aller Buchhaltungen (Repositories Buchhaltung_<Name>), anlegen, Personen per Link/QR einladen, Protokoll.
   Arbeitet direkt mit der GitHub-API und dem Admin-Schlüssel, der nur in diesem Browser gespeichert ist. */

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chf0 = n => (Math.round(n || 0)).toLocaleString('de-CH');
const chf = n => (Math.round((n || 0) * 100) / 100).toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, '0');
const heute = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = iso => iso ? iso.slice(0, 10).split('-').reverse().join('.') : '';
const fmtZeit = iso => { try { return new Date(iso).toLocaleString('de-CH', { dateStyle: 'short', timeStyle: 'short' }); } catch { return iso; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const b64enc = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const b64url = s => b64enc(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const PREFIX = 'Buchhaltung_';
const APP_URL = location.protocol === 'file:' ? 'https://pasaruwa-bit.github.io/Buchhaltung_App/' : new URL('./', location.href).href;

const A = { token: LS.get('admin.token', ''), login: '', tab: 'uebersicht', repos: [], info: {}, laden: false, protokoll: null, filter: { bh: '', wer: '', monate: 3 } };

/* ---------- GitHub ---------- */
async function gh(path, opt = {}, token = A.token) {
  const r = await fetch('https://api.github.com' + path, {
    method: opt.method || 'GET', cache: 'no-store',
    headers: { Authorization: 'Bearer ' + token, Accept: opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const ex = token === A.token && r.headers.get('github-authentication-token-expiration');
  if (ex) { const d = new Date(ex.replace(' UTC', 'Z').replace(' ', 'T')); if (!isNaN(d)) A.ablauf = d.toISOString().slice(0, 10); }
  if (opt.ok404 && r.status === 404) return null;
  if (!r.ok) {
    let msg = ''; try { msg = (await r.json()).message; } catch {}
    const e = new Error(r.status === 401 ? 'Admin-Schlüssel ungültig oder abgelaufen.' : r.status === 403 ? 'Keine Berechtigung (' + msg + ')' : `GitHub-Fehler ${r.status}: ${msg}`);
    e.status = r.status; throw e;
  }
  if (r.status === 204) return true;
  return opt.raw ? r.text() : r.json();
}
async function leseDatei(repo, pfad) {
  const j = await gh(`/repos/${repo}/contents/${pfad}`, { ok404: true });
  if (!j) return null;
  const text = j.content ? b64dec(j.content) : await gh(`/repos/${repo}/contents/${pfad}`, { raw: true });
  return { text, sha: j.sha };
}
async function schreibeDatei(repo, pfad, text, nachricht, sha) {
  return gh(`/repos/${repo}/contents/${pfad}`, { method: 'PUT', body: { message: nachricht, content: b64enc(text), ...(sha ? { sha } : {}) } });
}

/* ---------- Laden ---------- */
const anzeigeName = repoName => repoName.slice(PREFIX.length).replace(/_/g, ' ');
async function ladeAlles() {
  if (!A.token) return;
  A.laden = true; render();
  try {
    const me = await gh('/user'); A.login = me.login;
    document.getElementById('wer').textContent = me.login;
    const repos = [];
    for (let p = 1; p < 5; p++) {
      const page = await gh(`/user/repos?per_page=100&page=${p}&affiliation=owner&sort=full_name`);
      repos.push(...page); if (page.length < 100) break;
    }
    A.repos = repos.filter(r => r.name.toLowerCase().startsWith(PREFIX.toLowerCase()) && r.name.toLowerCase() !== 'buchhaltung_app')
      .map(r => ({ name: r.name, full: r.full_name, privat: r.private, url: r.html_url, pushed: r.pushed_at }));
    await Promise.all(A.repos.map(ladeInfo));
  } catch (e) { toast(e.message); }
  A.laden = false; render();
}
async function ladeInfo(r) {
  const info = { daten: null, personen: [], fehler: '' };
  try {
    const d = await leseDatei(r.full, 'data.json'); if (d) info.daten = JSON.parse(d.text);
    const p = await leseDatei(r.full, 'admin/personen.json'); if (p) { info.personen = JSON.parse(p.text); info.personenSha = p.sha; }
  } catch (e) { info.fehler = e.message; }
  A.info[r.full] = info;
}

/* ---------- Berechnungen ---------- */
function jahresBudget(k, y) { const j = k.jahre || {}; if (j[y] != null) return j[y]; const f = Object.keys(j).filter(x => x < y).sort().pop(); return f ? j[f] : (k.budget ? k.budget * 12 : 0); }
function kennzahlen(d, y = heute().slice(0, 4)) {
  const r = { budA: 0, budE: 0, istA: 0, istE: 0, anzahl: 0, letzte: null, konten: {}, fehlend: 0, ohne: 0 };
  if (!d) return r;
  const kmap = {}; for (const k of d.konten || []) { if (k.aktiv === false) continue; kmap[k.id] = k; const b = jahresBudget(k, y); if (k.typ === 'A') r.budA += b; else r.budE += b; r.konten[k.id] = { k, bud: b, ist: 0 }; }
  for (const b of d.buchungen || []) {
    if (!r.letzte || (b.u || 0) > r.letzte.u) r.letzte = b;
    if (!b.beleg && b.belegFehlt) r.fehlend++; else if (!b.beleg && b.ohneBeleg) r.ohne++;
    if (!b.datum || !b.datum.startsWith(y)) continue;
    const k = kmap[b.kontoId]; if (!k) continue;
    r.anzahl++; if (k.typ === 'A') r.istA += b.betrag; else r.istE += b.betrag;
    r.konten[k.id].ist += b.betrag;
  }
  return r;
}
function ablaufStatus(p) {
  if (p.gesperrt) return ['aus', 'gesperrt'];
  if (!p.ablauf) return ['', ''];
  const tage = Math.round((new Date(p.ablauf) - new Date(heute())) / 864e5);
  if (tage < 0) return ['aus', 'abgelaufen'];
  if (tage <= 30) return ['warnp', `läuft in ${tage} Tagen ab`];
  return ['', 'bis ' + fmtDate(p.ablauf)];
}

/* ---------- Darstellung ---------- */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === A.tab));
  const v = document.getElementById('view');
  if (!A.token && A.tab !== 'einstellungen') A.tab = 'einstellungen';
  v.innerHTML = { uebersicht: vUebersicht, neu: vNeu, protokoll: vProtokoll, einstellungen: vEinstellungen }[A.tab]();
  bind(v);
}
function bind(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    const [act, arg] = el.dataset.act.split('|');
    const ev = el.tagName === 'SELECT' ? 'change' : 'click';
    el.addEventListener(ev, e => { e.stopPropagation(); AKT[act] && AKT[act](arg, el, e); });
  });
}
function bar(soll, ist) {
  const p = soll > 0 ? Math.min(100, ist / soll * 100) : (ist > 0 ? 100 : 0);
  const cls = ist <= soll ? '' : (soll > 0 && ist <= soll * 1.1 ? 'warn' : 'bad');
  return `<div class="bar ${cls}"><i style="width:${p.toFixed(1)}%"></i></div>`;
}

function vUebersicht() {
  if (A.laden && !A.repos.length) return `<div class="card empty">Buchhaltungen werden geladen…</div>`;
  if (!A.repos.length) return `<div class="card"><h2>Noch keine Buchhaltungen</h2><p class="muted">Es wurde kein Repository mit dem Namen „${PREFIX}…“ gefunden.</p><button class="btn" data-act="tab|neu">Erste Buchhaltung anlegen</button></div>`;
  const y = heute().slice(0, 4);
  let tA = 0, tB = 0, tN = 0;
  const kacheln = A.repos.map(r => {
    const inf = A.info[r.full] || {}, z = kennzahlen(inf.daten, y);
    tA += z.istA; tB += z.budA; tN += z.anzahl;
    const pers = (inf.personen || []).map(p => { const [c, t] = ablaufStatus(p); return `<span class="pill ${c}" title="${esc(t)}">${esc(p.name)}${t && c ? ' · ' + esc(t) : ''}</span>`; }).join('') || '<span class="muted">noch niemand eingeladen</span>';
    return `<div class="card">
      <div class="row"><h2 style="margin:0">${esc(anzeigeName(r.name))}</h2>${r.privat ? '<span class="pill">privat</span>' : '<span class="pill aus">⚠ öffentlich</span>'}</div>
      <div class="muted"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full)}</a></div>
      ${inf.fehler ? `<p class="neg">${esc(inf.fehler)}</p>` : !inf.daten ? `<p class="muted">Noch keine Daten (data.json fehlt).</p>` : `
      <div class="row" style="margin-top:10px"><span>Ausgaben ${y}</span><span class="num"><b>${chf0(z.istA)}</b> / ${chf0(z.budA)} CHF</span></div>${bar(z.budA, z.istA)}
      <div class="row muted"><span>Einnahmen ${chf0(z.istE)} / ${chf0(z.budE)}</span><span>${z.anzahl} Buchungen</span></div>
      ${z.fehlend || z.ohne ? `<div class="personen">${z.fehlend ? `<span class="pill warnp">⚠ ${z.fehlend} ${z.fehlend === 1 ? 'Beleg fehlt' : 'Belege fehlen'}</span>` : ''}${z.ohne ? `<span class="pill">${z.ohne} ohne Beleg</span>` : ''}</div>` : ''}
      <div class="muted">Letzte Buchung: ${z.letzte ? fmtZeit(new Date(z.letzte.u).toISOString()) + (z.letzte.von ? ' · ' + esc(z.letzte.von) : '') : '–'}</div>`}
      <div class="personen">${pers}</div>
      <div class="btns" style="margin-top:12px"><button class="btn sm" data-act="einladen|${esc(r.full)}">+ Person einladen</button>
      <button class="btn sec sm" data-act="details|${esc(r.full)}">Details</button>
      <button class="btn sec sm" data-act="protokollVon|${esc(r.full)}">Protokoll</button></div></div>`;
  }).join('');
  const at = A.ablauf ? Math.round((new Date(A.ablauf) - new Date(heute())) / 864e5) : 99;
  const bald = A.repos.flatMap(r => ((A.info[r.full] || {}).personen || []).filter(p => !p.gesperrt && ablaufStatus(p)[0]).map(p => `${p.name} (${anzeigeName(r.name)})`));
  const warn = (at <= 30 ? `<div class="card warnkarte"><b>⚠ Dein Admin-Schlüssel läuft ${at <= 0 ? 'heute' : 'in ' + at + ' Tagen'} ab (${fmtDate(A.ablauf)}).</b> Unter „Admin-Schlüssel“ einen neuen erstellen.</div>` : '')
    + (bald.length ? `<div class="card warnkarte"><b>⚠ Zugänge laufen bald ab oder sind abgelaufen:</b> ${esc(bald.join(', '))}. Neuen Einladungslink erstellen und schicken.</div>` : '');
  return warn + `<div class="card"><div class="row"><div><h2 style="margin:0">${A.repos.length} Buchhaltungen</h2><div class="muted">Ausgaben ${y} total ${chf0(tA)} von ${chf0(tB)} CHF · ${tN} Buchungen</div></div>
    ${A.laden ? '<span class="muted">aktualisiere…</span>' : ''}</div></div><div class="kacheln">${kacheln}</div>`;
}

function vNeu() {
  const opts = A.repos.map(r => `<option value="${esc(r.full)}">Kopie von ${esc(anzeigeName(r.name))} (Kontoplan + Budget)</option><option value="${esc(r.full)}|leer">Kopie von ${esc(anzeigeName(r.name))} (nur Kontoplan)</option>`).join('');
  return `<div class="card"><h2>Neue Buchhaltung anlegen</h2>
    <label for="nName">Name (z. B. Toni)</label><input id="nName" placeholder="Name der Person oder Gruppe" autocomplete="off">
    <p class="muted" id="nVorschau">Repository: ${esc(A.login || 'benutzer')}/${PREFIX}…</p>
    <label for="nVorlage">Kontoplan</label><select id="nVorlage"><option value="standard">Standard-Kontoplan, ohne Budget</option>${opts}<option value="leerplan">Leer (keine Konten)</option></select>
    <div class="btns" style="margin-top:16px"><button class="btn" data-act="anlegen">Buchhaltung anlegen</button></div>
    <p class="muted" style="margin-top:12px">Erstellt ein <b>privates</b> Repository mit dem Kontoplan. Danach kannst du Personen einladen.</p></div>`;
}

function vProtokoll() {
  if (!A.protokoll) { setTimeout(ladeProtokoll, 0); return `<div class="card empty">Protokoll wird geladen…</div>`; }
  const f = A.filter;
  let liste = A.protokoll.filter(e => (!f.bh || e._repo === f.bh) && (!f.wer || e.wer === f.wer));
  const personen = [...new Set(A.protokoll.map(e => e.wer))].sort();
  const zeilen = liste.slice(0, 500).map(e => {
    const alt = e.betrag_alt != null ? chf(e.betrag_alt) : '', neu = e.betrag_neu != null ? chf(e.betrag_neu) : '';
    return `<tr><td class="klein">${fmtZeit(e.zeit)}</td><td>${esc(anzeigeName(e._repo.split('/')[1]))}</td><td>${esc(e.wer)}</td>
      <td><span class="pill ${e.aktion === 'gelöscht' ? 'aus' : e.aktion === 'geändert' ? 'warnp' : ''}">${esc(e.aktion)}</span></td>
      <td>${esc(e.objekt || '')}${e.datum ? ' ' + fmtDate(e.datum) : ''}${e.jahr ? ' ' + esc(e.jahr) : ''}<div class="klein">${esc(e.konto || '')}${e.text ? ' · ' + esc(e.text) : ''}${e.felder ? ' · ' + esc(e.felder) : ''}${e.beleg ? ' · 📎' : ''}</div></td>
      <td class="n">${alt && neu && alt !== neu ? `<s class="muted">${alt}</s> → ${neu}` : (neu || alt)}</td><td class="klein">${esc(e.geraet || '')}</td></tr>`;
  }).join('');
  return `<div class="card"><h2>Protokoll</h2><div class="filter">
    <select data-act="filterBh"><option value="">Alle Buchhaltungen</option>${A.repos.map(r => `<option value="${esc(r.full)}" ${f.bh === r.full ? 'selected' : ''}>${esc(anzeigeName(r.name))}</option>`).join('')}</select>
    <select data-act="filterWer"><option value="">Alle Personen</option>${personen.map(p => `<option ${f.wer === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
    <select data-act="filterMonate">${[1, 3, 6, 12, 24].map(m => `<option value="${m}" ${f.monate === m ? 'selected' : ''}>letzte ${m} Monat${m > 1 ? 'e' : ''}</option>`).join('')}</select>
    <button class="btn sec" data-act="csv">Als CSV (Excel)</button></div></div>
    <div class="card"><div class="tablewrap"><table><tr><th>Zeit</th><th>Buchhaltung</th><th>Person</th><th>Aktion</th><th>Was</th><th class="n">Betrag</th><th class="klein">Gerät</th></tr>
    ${zeilen || '<tr><td colspan="7" class="muted">Keine Einträge im gewählten Zeitraum.</td></tr>'}</table></div>
    <p class="muted">${liste.length} Einträge${liste.length > 500 ? ' (500 angezeigt, CSV enthält alle)' : ''}. Änderungen erscheinen, sobald das Gerät der Person abgeglichen hat. Zusätzlich führt GitHub für jedes Repository eine Änderungshistorie („Commits“).</p></div>`;
}
async function ladeProtokoll() {
  const ab = new Date(); ab.setMonth(ab.getMonth() - A.filter.monate + 1); const abM = `${ab.getFullYear()}-${pad(ab.getMonth() + 1)}`;
  const alle = [];
  await Promise.all(A.repos.map(async r => {
    try {
      const dir = await gh(`/repos/${r.full}/contents/protokoll`, { ok404: true });
      if (!Array.isArray(dir)) return;
      for (const f of dir.filter(f => f.name.endsWith('.jsonl') && f.name.slice(0, 7) >= abM)) {
        const t = await gh(`/repos/${r.full}/contents/protokoll/${f.name}`, { raw: true });
        for (const z of t.split('\n')) { if (!z.trim()) continue; try { alle.push({ ...JSON.parse(z), _repo: r.full }); } catch {} }
      }
    } catch (e) { toast(anzeigeName(r.name) + ': ' + e.message); }
  }));
  alle.sort((a, b) => String(b.zeit).localeCompare(String(a.zeit)));
  A.protokoll = alle; if (A.tab === 'protokoll') render();
}

function vEinstellungen() {
  return `<div class="card"><h2>Admin-Schlüssel</h2>
    <p>Das Admin-Center braucht einen Zugangsschlüssel deines GitHub-Kontos. Er wird <b>nur in diesem Browser</b> gespeichert.</p>
    <ol class="schritte">
      <li><a href="https://github.com/settings/tokens/new?scopes=repo&description=Budget%20Admin-Center" target="_blank" rel="noopener">Diesen Link öffnen</a> (GitHub, „classic“ Token). Das Häkchen bei <b>repo</b> ist schon gesetzt.</li>
      <li>Bei <b>Expiration</b> z. B. 1 Jahr wählen, unten auf <b>Generate token</b> klicken.</li>
      <li>Den Schlüssel (beginnt mit <code>ghp_</code>) kopieren und hier einfügen.</li>
    </ol>
    <label for="aT">Admin-Schlüssel</label><input id="aT" type="password" value="${esc(A.token)}" placeholder="ghp_…" autocomplete="off">
    <div class="btns" style="margin-top:12px"><button class="btn" data-act="tokenSpeichern">Speichern und laden</button>
    ${A.token ? '<button class="btn danger" data-act="tokenLoeschen">Von diesem Gerät entfernen</button>' : ''}</div>
    <p class="muted" style="margin-top:12px">⚠ Mit diesem Schlüssel kann man alle deine Repositories lesen und ändern. Nur auf eigenen, gesperrten Geräten verwenden.</p></div>
    <div class="card"><h2>Links</h2><p><a href="${esc(APP_URL)}" target="_blank" rel="noopener">Budget-App öffnen</a> · <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">Schlüssel der Personen verwalten (GitHub)</a></p></div>`;
}

/* ---------- Bottom-Sheet ---------- */
function sheet(html, onBind) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  const close = () => bg.remove();
  onBind && onBind(bg.querySelector('.sheet'), close);
}

/* ---------- Aktionen ---------- */
const repoVon = full => A.repos.find(r => r.full === full);
const AKT = {
  tab: t => { A.tab = t; render(); },
  tokenSpeichern: async () => { A.token = document.getElementById('aT').value.trim(); LS.set('admin.token', A.token); A.tab = 'uebersicht'; A.protokoll = null; await ladeAlles(); },
  tokenLoeschen: () => { if (!confirm('Admin-Schlüssel von diesem Gerät entfernen?')) return; A.token = ''; LS.del('admin.token'); A.repos = []; render(); },
  filterBh: (_, el) => { A.filter.bh = el.value; render(); },
  filterWer: (_, el) => { A.filter.wer = el.value; render(); },
  filterMonate: (_, el) => { A.filter.monate = +el.value; A.protokoll = null; render(); },
  protokollVon: full => { A.filter.bh = full; A.tab = 'protokoll'; render(); },
  csv: () => {
    const f = A.filter, rows = [['Zeit', 'Buchhaltung', 'Person', 'Gerät', 'Aktion', 'Objekt', 'Datum', 'Konto', 'Text', 'Betrag alt', 'Betrag neu', 'Felder']];
    A.protokoll.filter(e => (!f.bh || e._repo === f.bh) && (!f.wer || e.wer === f.wer)).forEach(e => rows.push([fmtZeit(e.zeit), anzeigeName(e._repo.split('/')[1]), e.wer, e.geraet || '', e.aktion, e.objekt || '', fmtDate(e.datum), e.konto || '', e.text || '', e.betrag_alt ?? '', e.betrag_neu ?? '', e.felder || '']));
    const csv = '﻿' + rows.map(r => r.map(c => { c = String(c); return /[;"\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c; }).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `Protokoll_${heute()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  },
  anlegen: async () => {
    const name = document.getElementById('nName').value.trim();
    if (!name) return toast('Bitte einen Namen eingeben.');
    const repoName = PREFIX + name.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/\s+/g, '_').replace(/[^\w.-]/g, '');
    if (A.repos.some(r => r.name.toLowerCase() === repoName.toLowerCase())) return toast(repoName + ' gibt es schon.');
    const vorlage = document.getElementById('nVorlage').value;
    if (!confirm(`Privates Repository ${A.login}/${repoName} anlegen?`)) return;
    try {
      toast('Wird angelegt…');
      const r = await gh('/user/repos', { method: 'POST', body: { name: repoName, private: true, description: `Budget-App: Buchhaltung ${name}`, has_issues: false, has_wiki: false, has_projects: false } });
      const t = Date.now(); let i = 0; const kid = () => t.toString(36) + 'k' + (i++).toString(36);
      let konten = [];
      if (vorlage === 'standard') konten = SEED.konten.map(k => ({ id: kid(), nr: k.nr, name: k.name, typ: k.typ, jahre: {}, fixBetrag: null, fix: k.fix || '', tag: k.tag || 1, aktiv: true, u: t }));
      else if (vorlage !== 'leerplan') {
        const [quelle, nurPlan] = vorlage.split('|');
        const qd = (A.info[quelle] || {}).daten;
        konten = (qd ? qd.konten : []).filter(k => k.aktiv !== false).map(k => ({ ...k, id: kid(), jahre: nurPlan ? {} : { ...(k.jahre || {}) }, fixBetrag: nurPlan ? null : (k.fixBetrag ?? null), u: t }));
      }
      const daten = { version: 2, start: heute().slice(0, 7), konten, buchungen: [], geloescht: {}, u: t };
      await schreibeDatei(r.full_name, 'data.json', JSON.stringify(daten, null, 1), 'Neue Buchhaltung angelegt (Admin-Center)');
      await schreibeDatei(r.full_name, 'README.md', `# Buchhaltung ${name}\n\nPrivate Daten der Budget-App (${APP_URL}).\n\n- \`data.json\`: Kontoplan, Jahresbudget, Buchungen (von der App verwaltet)\n- \`belege/\`: Belegfotos\n- \`protokoll/\`: Änderungsprotokoll\n- \`admin/personen.json\`: eingeladene Personen (ohne Schlüssel)\n`, 'README');
      await schreibeDatei(r.full_name, 'admin/personen.json', '[]', 'Personenliste');
      const neu = { name: r.name, full: r.full_name, privat: r.private, url: r.html_url, pushed: new Date().toISOString() };
      A.repos.push(neu); await ladeInfo(neu);
      toast(`${repoName} angelegt ✓`);
      A.tab = 'uebersicht'; render();
      einladenSheet(r.full_name);
    } catch (e) { toast(e.message); }
  },
  einladen: full => einladenSheet(full),
  details: full => detailsSheet(full)
};

function einladenSheet(full) {
  const r = repoVon(full), anzeige = anzeigeName(r.name);
  sheet(`<h2>Person einladen: ${esc(anzeige)}</h2>
    <label for="pName">Name der Person (erscheint im Protokoll)</label><input id="pName" placeholder="z. B. Toni" autocomplete="off">
    <label for="pTage">Zugang gültig</label><select id="pTage"><option value="90">3 Monate</option><option value="180">6 Monate</option><option value="366" selected>1 Jahr (maximal)</option></select>
    <h3 style="margin-top:16px">1. Schlüssel auf GitHub erstellen</h3>
    <button class="btn sec" id="ghOpen">GitHub-Seite öffnen ↗</button>
    <ol class="schritte muted">
      <li><b>Token name</b>: steht schon da (sonst z. B. „Budget ${esc(anzeige)} – Name“)</li>
      <li><b>Expiration</b>: wie oben gewählt</li>
      <li><b>Repository access</b> → <b>Only select repositories</b> → <b>${esc(r.name)}</b></li>
      <li><b>Permissions</b> → <b>Contents</b> → <b>Read and write</b></li>
      <li>Unten <b>Generate token</b>, Schlüssel kopieren</li>
    </ol>
    <h3>2. Schlüssel hier einfügen</h3>
    <input id="pToken" type="password" placeholder="github_pat_…" autocomplete="off">
    <div class="btns" style="margin-top:12px"><button class="btn" id="mk">Einladungslink erstellen</button><button class="btn sec" id="cx">Abbrechen</button></div>
    <div id="erg"></div>`, (root, close) => {
    const nameIn = root.querySelector('#pName');
    root.querySelector('#cx').onclick = close;
    root.querySelector('#ghOpen').onclick = () => {
      const p = nameIn.value.trim() || 'Person', tage = root.querySelector('#pTage').value;
      const q = new URLSearchParams({ name: `Budget ${anzeige} - ${p}`.slice(0, 40), description: `Budget-App Zugang für ${p} zur Buchhaltung ${anzeige}`, target_name: A.login, expires_in: tage, contents: 'write' });
      window.open('https://github.com/settings/personal-access-tokens/new?' + q, '_blank', 'noopener');
    };
    root.querySelector('#mk').onclick = async () => {
      const person = nameIn.value.trim(), token = root.querySelector('#pToken').value.trim();
      if (!person) return toast('Bitte den Namen der Person eingeben.');
      if (!/^(github_pat_|ghp_)/.test(token)) return toast('Bitte den Schlüssel von GitHub einfügen.');
      const erg = root.querySelector('#erg'); erg.innerHTML = '<p class="muted">Schlüssel wird geprüft…</p>';
      try {
        // Prüfen: kann der Schlüssel diese Buchhaltung lesen, aber nicht alles andere?
        await gh(`/repos/${full}/contents/data.json`, {}, token);
        const andere = A.repos.find(x => x.full !== full);
        if (andere && await gh(`/repos/${andere.full}/contents/data.json`, { ok404: true }, token).catch(() => null))
          if (!confirm('Achtung: Dieser Schlüssel hat auch Zugriff auf andere Buchhaltungen. Trotzdem verwenden?')) { erg.innerHTML = ''; return; }
      } catch (e) { erg.innerHTML = `<p class="neg">Der Schlüssel funktioniert für ${esc(r.name)} nicht: ${esc(e.message)}. Prüfe „Only select repositories“ und „Contents: Read and write“.</p>`; return; }
      const tage = +root.querySelector('#pTage').value, ab = new Date(); ab.setDate(ab.getDate() + tage);
      const link = APP_URL + '#einladung=' + b64url(JSON.stringify({ n: anzeige, r: full, t: token, p: person, a: ab.toISOString().slice(0, 10) }));
      // Person ohne Schlüssel in admin/personen.json festhalten
      try {
        const alt = await leseDatei(full, 'admin/personen.json');
        const liste = alt ? JSON.parse(alt.text) : [];
        liste.push({ id: uid(), name: person, schluessel: `Budget ${anzeige} - ${person}`, erstellt: heute(), ablauf: ab.toISOString().slice(0, 10), gesperrt: false });
        await schreibeDatei(full, 'admin/personen.json', JSON.stringify(liste, null, 1), `Person eingeladen: ${person}`, alt && alt.sha);
        A.info[full].personen = liste;
      } catch (e) { toast('Person konnte nicht in der Liste gespeichert werden: ' + e.message); }
      let qrSvg = '';
      try { const qr = qrcode(0, 'M'); qr.addData(link); qr.make(); qrSvg = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch { qrSvg = '<p class="muted">QR-Code zu lang, bitte den Link verwenden.</p>'; }
      erg.innerHTML = `<h3 style="margin-top:16px">3. Link oder QR-Code an ${esc(person)} geben</h3>
        <div class="qr">${qrSvg}</div><div class="link" id="lk">${esc(link)}</div>
        <div class="btns" style="margin-top:8px"><button class="btn" id="cp">Link kopieren</button>${navigator.share ? '<button class="btn sec" id="sh">Teilen…</button>' : ''}<button class="btn sec" id="fertig">Fertig</button></div>
        <p class="muted">⚠ Der Link enthält den Schlüssel. Nur privat weitergeben (persönlich, SMS oder WhatsApp direkt an die Person), nicht in Gruppen. ${esc(person)} öffnet ihn am Handy in Chrome oder Safari, bestätigt und fügt die App zum Startbildschirm hinzu.</p>`;
      erg.querySelector('#cp').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link kopiert ✓'); } catch { toast('Bitte den Link markieren und kopieren.'); } };
      const sh = erg.querySelector('#sh'); if (sh) sh.onclick = () => navigator.share({ title: 'Budget-App', text: `Deine Buchhaltung ${anzeige}`, url: link }).catch(() => {});
      erg.querySelector('#fertig').onclick = close;
      root.querySelector('#mk').remove(); render();
    };
  });
}

function detailsSheet(full) {
  const r = repoVon(full), inf = A.info[full] || {}, y = heute().slice(0, 4), z = kennzahlen(inf.daten, y);
  const zeilen = typ => Object.values(z.konten).filter(x => x.k.typ === typ && (x.bud || x.ist)).sort((a, b) => String(a.k.nr).localeCompare(String(b.k.nr), 'de', { numeric: true }))
    .map(x => `<tr><td>${esc(x.k.name)}</td><td class="n">${chf0(x.bud)}</td><td class="n">${chf0(x.ist)}</td><td class="n">${x.bud ? Math.round(x.ist / x.bud * 100) + '%' : '–'}</td></tr>`).join('');
  const kmap = {}; ((inf.daten || {}).konten || []).forEach(k => kmap[k.id] = k);
  const letzte = ((inf.daten || {}).buchungen || []).slice().sort((a, b) => (b.u || 0) - (a.u || 0)).slice(0, 15)
    .map(b => `<tr><td class="klein">${fmtDate(b.datum)}</td><td>${esc(b.text || (kmap[b.kontoId] || {}).name || '')}${b.beleg ? ' 📎' : b.belegFehlt ? ' <span class="neg">⚠ Beleg fehlt</span>' : b.ohneBeleg ? ' <span class="klein">(ohne Beleg: ' + esc(b.ohneBeleg) + ')</span>' : ''}<div class="klein">${esc((kmap[b.kontoId] || {}).name || '')}</div></td><td class="klein">${esc(b.von || '')}</td><td class="n">${chf(b.betrag)}</td></tr>`).join('');
  const pers = (inf.personen || []).map(p => { const [c, t] = ablaufStatus(p); return `<li><div class="grow"><b>${esc(p.name)}</b> <span class="pill ${c}">${esc(t || 'aktiv')}</span><div class="muted">Schlüssel „${esc(p.schluessel)}“ · eingeladen ${fmtDate(p.erstellt)}</div></div>
    ${p.gesperrt ? '' : `<button class="btn danger sm" data-sperr="${esc(p.id)}">Sperren</button>`}</li>`; }).join('');
  sheet(`<h2>${esc(anzeigeName(r.name))}</h2><p class="muted"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(full)}</a> · <a href="${esc(r.url)}/commits" target="_blank" rel="noopener">GitHub-Historie</a> · <a href="${esc(r.url)}/tree/main/belege" target="_blank" rel="noopener">Belege</a></p>
    <h3>Personen</h3><ul class="list">${pers || '<li class="muted">Noch niemand eingeladen.</li>'}</ul>
    <h3 style="margin-top:14px">Ausgaben ${y}</h3><div class="tablewrap"><table><tr><th>Konto</th><th class="n">Budget</th><th class="n">Ist</th><th class="n">%</th></tr>${zeilen('A') || '<tr><td colspan="4" class="muted">–</td></tr>'}
    <tr class="sum"><td>Total</td><td class="n">${chf0(z.budA)}</td><td class="n">${chf0(z.istA)}</td><td class="n">${z.budA ? Math.round(z.istA / z.budA * 100) + '%' : '–'}</td></tr></table></div>
    <h3 style="margin-top:14px">Einnahmen ${y}</h3><div class="tablewrap"><table><tr><th>Konto</th><th class="n">Budget</th><th class="n">Ist</th><th class="n">%</th></tr>${zeilen('E') || '<tr><td colspan="4" class="muted">–</td></tr>'}
    <tr class="sum"><td>Total</td><td class="n">${chf0(z.budE)}</td><td class="n">${chf0(z.istE)}</td><td class="n">${z.budE ? Math.round(z.istE / z.budE * 100) + '%' : '–'}</td></tr></table></div>
    <h3 style="margin-top:14px">Letzte Buchungen</h3><div class="tablewrap"><table>${letzte || '<tr><td class="muted">Keine Buchungen.</td></tr>'}</table></div>
    <div class="btns" style="margin-top:16px"><button class="btn" id="cx">Schliessen</button></div>`, (root, close) => {
    root.querySelector('#cx').onclick = close;
    root.querySelectorAll('[data-sperr]').forEach(b => b.onclick = async () => {
      const p = inf.personen.find(x => x.id === b.dataset.sperr);
      if (!confirm(`Zugang von ${p.name} sperren?\n\nWichtig: Auf der nächsten Seite den Schlüssel „${p.schluessel}“ mit „Delete“ löschen. Erst dann ist der Zugang wirklich weg.`)) return;
      window.open('https://github.com/settings/personal-access-tokens', '_blank', 'noopener');
      try {
        const alt = await leseDatei(full, 'admin/personen.json'); const liste = JSON.parse(alt.text);
        const e = liste.find(x => x.id === p.id); if (e) { e.gesperrt = true; e.gesperrtAm = heute(); }
        await schreibeDatei(full, 'admin/personen.json', JSON.stringify(liste, null, 1), `Zugang gesperrt: ${p.name}`, alt.sha);
        inf.personen = liste; close(); render(); toast(`${p.name} als gesperrt markiert. Schlüssel auf GitHub löschen!`);
      } catch (e) { toast(e.message); }
    });
  });
}

/* ---------- Hilfen ---------- */
let toastT;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 4000); }

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { A.tab = b.dataset.tab; render(); });
document.getElementById('reload').onclick = () => { A.protokoll = null; ladeAlles(); };
render();
ladeAlles();

</script>
</body>
</html>
