<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root {
  --bg: #f4f6f5; --card: #fff; --text: #1d2422; --muted: #66706d; --line: #e1e6e4;
  --brand: #1f6f5c; --brand-soft: #e3f1ec; --ok: #2e8b57; --warn: #c98a00; --bad: #c0392b;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --card: #1c2220; --text: #e8eeec; --muted: #9aa5a1; --line: #2c3431;
    --brand: #4fb79a; --brand-soft: #1d332c; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--brand); color: #fff; }
.top button { background: none; border: 0; color: #fff; cursor: pointer; }
.mandant { font-weight: 600; max-width: 40%; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.15) !important; }
.monat { flex: 1; white-space: nowrap; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
.monat button { font-size: 26px; padding: 0 10px; line-height: 1; }
.sync { font-size: 20px; padding: 6px 10px; }
.sync.dirty::after { content: "•"; color: #ffd166; margin-left: 2px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 10px; font-size: 11px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tabs button span { font-size: 20px; line-height: 1.1; }
.tabs button.on { color: var(--brand); font-weight: 600; }
.tabs .plus span { background: var(--brand); color: #fff; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; font-size: 26px; margin-top: -14px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }

.card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05); border: 1px solid var(--line); }
h2 { font-size: 18px; margin: 4px 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.big { font-size: 26px; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pos { color: var(--ok); } .neg { color: var(--bad); }

.bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li.click { cursor: pointer; }

.btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--brand); color: #fff;
  font-weight: 600; cursor: pointer; }
.btn.sec { background: var(--brand-soft); color: var(--brand); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 14px; }
.btn.full { width: 100%; padding: 14px; font-size: 17px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); }
input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 4px; border-top: 1px solid var(--line); }
th { text-align: left; color: var(--muted); font-weight: 600; border-top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sum td { font-weight: 700; border-top: 2px solid var(--text); }
tr.click { cursor: pointer; }
.tablewrap { overflow-x: auto; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.chart { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.chart .bars { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.chart .b { width: 40%; border-radius: 3px 3px 0 0; min-height: 1px; }
.chart .b.soll { background: var(--line); } .chart .b.ist { background: var(--brand); }
.chart .b.ist.over { background: var(--bad); }
.chart small { font-size: 10px; color: var(--muted); margin-top: 3px; }

#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff;
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  max-width: 90vw; text-align: center; }
#toast.show { opacity: .95; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
.empty { text-align: center; color: var(--muted); padding: 20px 0; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }

.belegbox { margin: 4px 0 6px; }
.belegbox label.btn { display: inline-block; color: var(--brand); margin: 0; font-size: 15px; }
.belegthumb { display: block; max-width: 100%; max-height: 220px; margin: 10px 0 4px; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
#belegStatus { margin-top: 4px; }
a.btn { text-decoration: none; display: inline-block; }

.installbar { position: fixed; left: 8px; right: 8px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 8; background: var(--card);
  border: 1px solid var(--brand); border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; max-width: 560px; margin: 0 auto; }
.schritte li { margin: 6px 0; }

#belegVorschau #zuschnitt { display: block; margin-bottom: 6px; }
.crop { position: relative; touch-action: none; user-select: none; line-height: 0; }
.crop img { width: 100%; height: auto; display: block; }
.cropbox { position: absolute; border: 2px solid var(--brand); box-shadow: 0 0 0 9999px rgba(0,0,0,.45); cursor: move; touch-action: none; }
.cropbox i { position: absolute; width: 26px; height: 26px; background: #fff; border: 3px solid var(--brand); border-radius: 50%; }
.cropbox i[data-e=nw] { left: -13px; top: -13px; cursor: nwse-resize; } .cropbox i[data-e=ne] { right: -13px; top: -13px; cursor: nesw-resize; }
.cropbox i[data-e=sw] { left: -13px; bottom: -13px; cursor: nesw-resize; } .cropbox i[data-e=se] { right: -13px; bottom: -13px; cursor: nwse-resize; }
.crop { overflow: hidden; border-radius: 8px; }
.teilbox { margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.teilbox h3 { margin: 0 0 4px; }
.teil { display: grid; grid-template-columns: 1fr 90px auto; gap: 6px; align-items: center; margin: 6px 0; }
.teil select, .teil input { margin: 0; }
.teil .tT { grid-column: 1 / -1; font-size: 12px; margin-top: -2px; }
.frage { margin-top: 10px; padding: 10px; border-radius: 10px; background: #fff3d6; color: #5a4300; }

</style>
</head>

<script>
'use strict';
/* Budget-App: Version 1
   Daten liegen lokal im Browser und werden optional mit einem privaten GitHub-Repository abgeglichen.
   Pro Buchhaltung (Mandant) ein eigenes Repository. */

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Speichern fehlgeschlagen: ' + e.message); } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MK = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chf = (n, d = 2) => (Math.round((n || 0) * 100) / 100).toLocaleString('de-CH', { minimumFractionDigits: d, maximumFractionDigits: d });
const chf0 = n => chf(n, 0);
const parseBetrag = s => { const v = parseFloat(String(s).replace(/['’\s]/g, '').replace(',', '.')); return isNaN(v) ? null : Math.round(v * 100) / 100; };
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ymOf = iso => iso.slice(0, 7);
const ymNow = () => todayISO().slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const ymLabel = ym => `${MONATE[+ym.slice(5) - 1]} ${ym.slice(0, 4)}`;
const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };

/* ---------- Zustand ---------- */
const S = {
  mandanten: LS.get('budget.mandanten', []),
  aktiv: LS.get('budget.aktiv', null),
  ich: LS.get('budget.ich', ''),
  ym: ymNow(),
  tab: 'start',
  auswertung: 'monat',
  filterKonto: '',
  data: null,
  syncing: false
};

function neueDaten(vorlage) {
  const d = { version: 2, start: ymNow(), konten: [], buchungen: [], geloescht: {}, u: now() };
  if (vorlage === 'excel') {
    // Kontoplan aus dem Excel, aber ohne Vorgabewerte: Jahresbudget und Monatsbeträge trägt man selbst ein
    d.konten = SEED.konten.map(k => ({ id: uid(), nr: k.nr, name: k.name, typ: k.typ, jahre: {}, fixBetrag: null,
      fix: k.fix || '', tag: k.tag || 1, aktiv: true, u: now() }));
  } else if (vorlage && vorlage.konten) {
    d.konten = vorlage.konten.filter(k => k.aktiv !== false).map(k => ({ ...k, id: uid(), jahre: { ...(k.jahre || {}) }, u: now() }));
  }
  return d;
}
// Umstellung Version 1 (Monatsbudget) -> Version 2 (Jahresbudget): Budgetwerte werden geleert
function migriere(d) {
  if (!d) return d;
  for (const k of d.konten || []) {
    if (!k.jahre) { k.jahre = {}; k.fixBetrag = null; delete k.budget; delete k.monate; k.u = now(); }
  }
  d.version = 2;
  return d;
}
function mandant() { return S.mandanten.find(m => m.id === S.aktiv); }
function ladeDaten() { S.data = migriere(LS.get('budget.data.' + S.aktiv, null)) || neueDaten('excel'); }
function speichereMandanten() { LS.set('budget.mandanten', S.mandanten); LS.set('budget.aktiv', S.aktiv); }
function speichere(syncSpaeter = true) {
  S.data.u = now();
  LS.set('budget.data.' + S.aktiv, S.data);
  const m = mandant();
  if (m) { m.dirty = true; speichereMandanten(); }
  if (syncSpaeter) planeSync();
  aktualisiereKopf();
}

function init() {
  if (!S.mandanten.length) {
    const id = uid();
    S.mandanten.push({ id, name: 'Meine Buchhaltung', repo: '', dirty: false });
    S.aktiv = id;
    LS.set('budget.data.' + id, neueDaten('excel'));
    speichereMandanten();
  }
  if (!mandant()) S.aktiv = S.mandanten[0].id;
  ladeDaten();
  const eingeladen = pruefeEinladung();
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => zeige(b.dataset.tab));
  document.getElementById('prevM').onclick = () => { S.ym = ymAdd(S.ym, -1); render(); };
  document.getElementById('nextM').onclick = () => { S.ym = ymAdd(S.ym, 1); render(); };
  document.getElementById('mandantBtn').onclick = mandantWahl;
  document.getElementById('syncBtn').onclick = () => sync(true);
  render();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => sync(eingeladen), 400);
  setTimeout(() => zeigeInstallHinweis(eingeladen), 1500);
  window.addEventListener('hashchange', () => { if (pruefeEinladung()) { render(); sync(true); } });
}

/* ---------- Berechnungen ---------- */
const konto = id => S.data.konten.find(k => k.id === id);
// Beleg nötig: einstellbar pro Konto; ohne Einstellung bei variablen Ausgaben ja, bei festen Posten und Einnahmen nein
const belegNoetig = k => !!k && (k.beleg != null ? !!k.beleg : (k.typ === 'A' && !k.fix));
const fehlendeBelege = () => S.data.buchungen.filter(b => b.belegFehlt && !b.beleg);
const kontenTyp = typ => S.data.konten.filter(k => k.typ === typ && k.aktiv !== false).sort((a, b) => String(a.nr).localeCompare(String(b.nr), 'de', { numeric: true }));
// Jahresbudget eines Kontos; ohne Eintrag gilt der Wert des letzten Jahres mit Budget
function jahresBudget(k, y) {
  const j = k.jahre || {}; y = String(y);
  if (j[y] != null) return j[y];
  const frueher = Object.keys(j).filter(x => x < y).sort().pop();
  return frueher ? j[frueher] : 0;
}
const budgetFuer = (k, ym) => jahresBudget(k, ym.slice(0, 4)) / 12; // Monat = 1/12 als Richtwert
const fixBetrag = k => (k.fixBetrag != null && k.fixBetrag > 0) ? k.fixBetrag : null;
const buchungenIm = ym => S.data.buchungen.filter(b => ymOf(b.datum) === ym);
function istFuer(kontoId, ym) { let s = 0; for (const b of S.data.buchungen) if (b.kontoId === kontoId && ymOf(b.datum) === ym) s += b.betrag; return s; }
function summen(ym) {
  const r = { A: { soll: 0, ist: 0 }, E: { soll: 0, ist: 0 } };
  for (const k of S.data.konten) { if (k.aktiv === false) continue; r[k.typ].soll += budgetFuer(k, ym); }
  for (const b of buchungenIm(ym)) { const k = konto(b.kontoId); if (k) r[k.typ].ist += b.betrag; }
  return r;
}
// Differenz immer so, dass + = besser als Budget
const diff = (typ, soll, ist) => typ === 'A' ? soll - ist : ist - soll;
function ampel(typ, soll, ist) {
  if (typ === 'A') { if (ist <= soll) return ''; if (soll > 0 && ist <= soll * 1.1) return 'warn'; return 'bad'; }
  if (ist >= soll) return ''; if (ist >= soll * 0.9) return 'warn'; return 'bad';
}
function offeneFixposten(ym) {
  if (ym < S.data.start || ym > ymNow()) return [];
  return S.data.konten.filter(k => k.fix && k.aktiv !== false &&
    !S.data.buchungen.some(b => b.fixKonto === k.id && b.fixMonat === ym));
}

/* ---------- Darstellung ---------- */
function zeige(tab) { S.tab = tab; render(); window.scrollTo(0, 0); }
function aktualisiereKopf() {
  const m = mandant();
  document.getElementById('mandantBtn').textContent = (m ? m.name : '') + ' ▾';
  document.getElementById('monatLabel').textContent = ymLabel(S.ym);
  const sb = document.getElementById('syncBtn');
  sb.classList.toggle('dirty', !!(m && m.repo && m.dirty));
  sb.style.visibility = m && m.repo ? 'visible' : 'hidden';
}
function render() {
  aktualisiereKopf();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const v = document.getElementById('view');
  const f = { start: vStart, buchungen: vBuchungen, neu: vNeu, auswertung: vAuswertung, einstellungen: vEinstellungen }[S.tab];
  v.innerHTML = f();
  bind(v);
}
// einfache Ereignisbindung über data-act Attribute
function bind(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    const [act, arg] = el.dataset.act.split(':');
    const ev = el.tagName === 'SELECT' || el.tagName === 'INPUT' ? 'change' : 'click';
    el.addEventListener(ev, e => { e.stopPropagation(); AKT[act] && AKT[act](arg, el, e); });
  });
}
function barHtml(typ, soll, ist) {
  const p = soll > 0 ? Math.min(100, ist / soll * 100) : (ist > 0 ? 100 : 0);
  return `<div class="bar ${ampel(typ, soll, ist)}"><i style="width:${p.toFixed(1)}%"></i></div>`;
}

function vStart() {
  const ym = S.ym, s = summen(ym), offen = offeneFixposten(ym);
  const saldo = s.E.ist - s.A.ist;
  const pctA = s.A.soll ? Math.round(s.A.ist / s.A.soll * 100) : 0;
  let h = `<div class="card">
    <h3>Ausgaben ${esc(MONATE[+ym.slice(5) - 1])}</h3>
    <div class="row"><span class="big">${chf0(s.A.ist)}</span><span class="muted">von ${chf0(s.A.soll)} CHF · ${pctA}%</span></div>
    ${barHtml('A', s.A.soll, s.A.ist)}
    <div class="row muted"><span>${s.A.soll - s.A.ist >= 0 ? 'Noch verfügbar' : 'Über Budget'}</span><span class="num ${s.A.soll - s.A.ist >= 0 ? 'pos' : 'neg'}">${chf0(Math.abs(s.A.soll - s.A.ist))} CHF</span></div>
  </div>
  ${fehltKarte()}${jahrKarte(ym)}
  <div class="card"><div class="grid2">
    <div><h3>Einnahmen</h3><div class="big" style="font-size:20px">${chf0(s.E.ist)}</div><div class="muted">Budget ${chf0(s.E.soll)}</div></div>
    <div><h3>Saldo</h3><div class="big ${saldo >= 0 ? 'pos' : 'neg'}" style="font-size:20px">${saldo >= 0 ? '+' : ''}${chf0(saldo)}</div><div class="muted">Einnahmen − Ausgaben</div></div>
  </div></div>`;
  if (offen.length) {
    h += `<div class="card"><h2>Feste Posten bestätigen <span class="pill">${offen.length}</span></h2><ul class="list">` +
      offen.map(k => `<li><div class="grow"><div class="t">${esc(k.name)}</div>
        <div class="muted">${k.typ === 'E' ? 'Einnahme' : 'Ausgabe'} · ${fixBetrag(k) ? (k.fix === 'variabel' ? 'variabel, ca. ' : '') + chf(fixBetrag(k)) + ' CHF' : 'Betrag eintragen'}</div></div>
        <button class="btn sec sm" data-act="fixSkip:${k.id}" title="Diesen Monat entfällt">entfällt</button>
        <button class="btn sm" data-act="fixOk:${k.id}">${k.fix === 'fix' && fixBetrag(k) ? '✓' : 'Betrag…'}</button></li>`).join('') +
      `</ul>${offen.some(k => k.fix === 'fix' && fixBetrag(k)) ? `<div class="btns" style="margin-top:8px"><button class="btn sec sm" data-act="fixAlle">Alle fixen bestätigen</button></div>` : ''}</div>`;
  } else if (ym >= S.data.start && ym <= ymNow() && S.data.konten.some(k => k.fix)) {
    h += `<div class="card muted">✓ Alle festen Posten für diesen Monat sind bestätigt.</div>`;
  }
  // Konten über Budget
  const ueber = kontenTyp('A').map(k => ({ k, soll: budgetFuer(k, ym), ist: istFuer(k.id, ym) })).filter(x => x.soll > 0 && x.ist > x.soll).sort((a, b) => (b.ist - b.soll) - (a.ist - a.soll));
  if (ueber.length) {
    h += `<div class="card"><h2>Über Budget</h2><ul class="list">` + ueber.slice(0, 5).map(x =>
      `<li><span class="dot ${ampel('A', x.soll, x.ist)}"></span><div class="grow t">${esc(x.k.name)}</div><span class="num neg">−${chf(x.ist - x.soll)}</span></li>`).join('') + `</ul></div>`;
  }
  const letzte = buchungenIm(ym).sort((a, b) => b.datum.localeCompare(a.datum) || b.u - a.u).slice(0, 5);
  h += `<div class="card"><div class="row"><h2>Letzte Buchungen</h2><button class="btn sec sm" data-act="tab:buchungen">alle</button></div>` +
    (letzte.length ? `<ul class="list">${letzte.map(buchungLi).join('')}</ul>` : `<div class="empty">Noch keine Buchungen in diesem Monat.</div>`) + `</div>`;
  return h;
}
function fehltKarte() {
  const n = fehlendeBelege().length; if (!n) return '';
  return `<div class="card click" data-act="fehlend"><div class="row"><h3 style="margin:0">📎 ${n} ${n === 1 ? 'Beleg fehlt' : 'Belege fehlen'}</h3><span class="btn sec sm">nachreichen</span></div></div>`;
}
function jahrKarte(ym) {
  const y = ym.slice(0, 4);
  let soll = 0, ist = 0;
  for (const k of kontenTyp('A')) soll += jahresBudget(k, y);
  for (const b of S.data.buchungen) { if (!b.datum.startsWith(y)) continue; const k = konto(b.kontoId); if (k && k.typ === 'A') ist += b.betrag; }
  if (!soll) return `<div class="card"><h3>Jahresbudget ${y}</h3><p class="muted">Noch kein Jahresbudget erfasst.</p><button class="btn sec sm" data-act="jahrBudget:${y}">Jahresbudget ${y} erfassen</button></div>`;
  const anteil = sollAnteil(y), sollBis = soll * anteil;
  return `<div class="card"><h3>Ausgaben Jahr ${y}</h3>
    <div class="row"><span class="big" style="font-size:20px">${chf0(ist)}</span><span class="muted">von ${chf0(soll)} CHF · ${Math.round(ist / soll * 100)}%</span></div>
    ${barHtml('A', soll, ist)}
    <div class="row muted"><span>Soll bis heute${S.data.start.startsWith(y) && S.data.start > y + '-01' ? ' (seit ' + MK[+S.data.start.slice(5) - 1] + ')' : ''}</span><span class="num ${ist <= sollBis ? 'pos' : 'neg'}">${chf0(sollBis)} CHF</span></div></div>`;
}
// Anteil des Jahres, der bis heute vergangen ist (ganzes Jahr = 1)
function sollAnteil(y) {
  const jetzt = ymNow().slice(0, 4);
  if (y < jetzt) return 1; if (y > jetzt) return 0;
  // Erst ab Beginn der Erfassung zählen, sonst wäre das Soll im ersten Jahr viel zu hoch
  const d = new Date(), jan = new Date(d.getFullYear(), 0, 1), ende = new Date(d.getFullYear() + 1, 0, 1);
  const st = S.data.start && S.data.start.startsWith(y) ? new Date(+y, +S.data.start.slice(5) - 1, 1) : jan;
  return Math.max(0, (d - st) / (ende - jan));
}
function buchungLi(b) {
  const k = konto(b.kontoId) || { name: '(Konto gelöscht)', typ: 'A' };
  return `<li class="click" data-act="edit:${b.id}"><div class="grow"><div class="t">${esc(b.text || k.name)}</div>
    <div class="muted">${b.beleg ? '📎 ' : b.belegFehlt ? '<span class="neg">⚠ Beleg fehlt</span> · ' : b.ohneBeleg ? 'ohne Beleg · ' : ''}${b.gruppe ? '⇄ ' : ''}${fmtDate(b.datum)} · ${esc(k.name)}${b.von ? ' · ' + esc(b.von) : ''}</div></div>
    <span class="num ${k.typ === 'E' ? 'pos' : ''}">${k.typ === 'E' ? '+' : '−'}${chf(b.betrag)}</span></li>`;
}

function vBuchungen() {

function buchungsListe() {
  if (S.nurFehlend) {
    const l = fehlendeBelege().sort((a, b) => b.datum.localeCompare(a.datum));
    return `<div class="row"><h2>${l.length} ${l.length === 1 ? 'Beleg fehlt' : 'Belege fehlen'}</h2><button class="btn sec sm" data-act="alleZeigen">alle Buchungen</button></div>
      <p class="muted">Buchung antippen und das Foto anhängen.</p>${l.length ? `<ul class="list">${l.map(buchungLi).join('')}</ul>` : '<div class="empty">✓ Alle Belege sind da.</div>'}`;
  }
  const q = (S.suche || '').trim().toLowerCase();
  let list = q ? S.data.buchungen.slice() : buchungenIm(S.ym);
  if (S.filterKonto) list = list.filter(b => b.kontoId === S.filterKonto);
  if (q) {
    const qb = parseBetrag(q);
    list = list.filter(b => { const k = konto(b.kontoId) || {};
      return (b.text || '').toLowerCase().includes(q) || (k.name || '').toLowerCase().includes(q) || String(k.nr) === q || (qb != null && Math.abs(b.betrag - qb) < 0.005); });
  }
  list.sort((a, b) => b.datum.localeCompare(a.datum) || b.u - a.u);
  const sum = list.reduce((s, b) => { const k = konto(b.kontoId); return s + (k && k.typ === 'E' ? b.betrag : -b.betrag); }, 0);
  return `<div class="row"><h2>${list.length} ${list.length === 1 ? 'Buchung' : 'Buchungen'}${q ? ' gefunden' : ''}</h2><span class="num muted">Saldo ${chf(sum)}</span></div>
    ${list.length ? `<ul class="list">${list.map(buchungLi).join('')}</ul>` : `<div class="empty">${q ? 'Nichts gefunden.' : 'Keine Buchungen.'}</div>`}`;
}

function formBuchung(b) {
  const typ = b._typ || (konto(b.kontoId) || {}).typ || 'A';
  const konten = kontenTyp(typ).map(k => `<option value="${k.id}" ${b.kontoId === k.id ? 'selected' : ''}>${esc(k.nr)} ${esc(k.name)}</option>`).join('');

function leseForm(root) {

  const datum = root.querySelector('#fDatum').value;
  const kontoId = root.querySelector('#fKonto').value;
  if (betrag == null || betrag < 0) { toast('Bitte einen gültigen Betrag eingeben.'); return null; }
  if (!datum) { toast('Bitte ein Datum wählen.'); return null; }
  if (!kontoId) { toast('Bitte ein Konto wählen.'); return null; }
  return { betrag, datum, kontoId, text: root.querySelector('#fText').value.trim() };
}
function bindTypSeg(root, b) {
  root.querySelectorAll('#fTyp button').forEach(btn => btn.onclick = () => {
    const vals = { betrag: root.querySelector('#fBetrag').value, datum: root.querySelector('#fDatum').value, text: root.querySelector('#fText').value };
    const holder = root.querySelector('#fHolder');
    holder.innerHTML = formBuchung({ ...b, ...vals, _typ: btn.dataset.typ, kontoId: '' });

    bindTypSeg(root, b);

  if (!b.id) {

    fT.onchange = () => { const typ = root.querySelector('#fTyp button.on')?.dataset.typ || 'A'; const kId = vorschlagKonto(fT.value, typ); if (kId) root.querySelector('#fKonto').value = kId; };
  }
}

function vAuswertung() {
  const seg = `<div class="seg" style="margin-bottom:12px"><button data-act="aw:monat" class="${S.auswertung === 'monat' ? 'on' : ''}">Monat</button><button data-act="aw:jahr" class="${S.auswertung === 'jahr' ? 'on' : ''}">Jahr ${S.ym.slice(0, 4)}</button></div>`;
  return seg + (S.auswertung === 'monat' ? awMonat() : awJahr());
}
function kontoTabelle(typ, sollF, istF, titel, sollTitel) {
  let ts = 0, ti = 0;
  const rows = kontenTyp(typ).map(k => {
    const soll = sollF(k), ist = istF(k); ts += soll; ti += ist;
    if (!soll && !ist) return '';
    const d = diff(typ, soll, ist);
    return `<tr class="click" data-act="kontoBuch:${k.id}"><td><span class="dot ${ampel(typ, soll, ist)}"></span>${esc(k.name)}</td><td class="n">${chf0(soll)}</td><td class="n">${chf0(ist)}</td><td class="n ${d < 0 ? 'neg' : d > 0 ? 'pos' : ''}">${d > 0 ? '+' : ''}${chf0(d)}</td></tr>`;
  }).join('');
  const d = diff(typ, ts, ti);
  return `<div class="card"><h2>${titel}</h2><div class="tablewrap"><table><tr><th>Konto</th><th class="n">${sollTitel}</th><th class="n">Ist</th><th class="n">Abw.</th></tr>${rows}
    <tr class="sum"><td>Total</td><td class="n">${chf0(ts)}</td><td class="n">${chf0(ti)}</td><td class="n ${d < 0 ? 'neg' : 'pos'}">${d > 0 ? '+' : ''}${chf0(d)}</td></tr></table></div>
    <p class="muted">Abweichung: + = besser als Budget, − = schlechter.</p></div>`;
}
function awMonat() {
  const ym = S.ym;
  return kontoTabelle('A', k => budgetFuer(k, ym), k => istFuer(k.id, ym), 'Ausgaben ' + ymLabel(ym), 'Budget') +
    kontoTabelle('E', k => budgetFuer(k, ym), k => istFuer(k.id, ym), 'Einnahmen ' + ymLabel(ym), 'Budget');
}
function awJahr() {
  const y = S.ym.slice(0, 4), yms = MONATE.map((_, i) => `${y}-${pad(i + 1)}`);
  const ms = yms.map(summen);
  const max = Math.max(1, ...ms.map(s => Math.max(s.A.soll, s.A.ist)));
  const chart = `<div class="chart">${ms.map((s, i) => `<div class="col"><div class="bars">
      <div class="b soll" style="height:${s.A.soll / max * 100}%" title="Budget ${chf0(s.A.soll)}"></div>
      <div class="b ist ${s.A.ist > s.A.soll ? 'over' : ''}" style="height:${s.A.ist / max * 100}%" title="Ist ${chf0(s.A.ist)}"></div></div><small>${MK[i]}</small></div>`).join('')}</div>
    <p class="muted"><span class="dot" style="background:var(--line)"></span>Budget <span class="dot" style="background:var(--brand);margin-left:10px"></span>Ausgaben <span class="dot bad" style="margin-left:10px"></span>über Budget</p>`;
  let kum = 0, tA = 0, tAs = 0, tE = 0, tEs = 0, tD = 0;
  const rows = ms.map((s, i) => {
    const saldo = s.E.ist - s.A.ist; kum += saldo; tA += s.A.ist; tAs += s.A.soll; tE += s.E.ist; tEs += s.E.soll;
    const aktiv = yms[i] >= S.data.start && yms[i] <= ymNow();
    const d = s.A.soll - s.A.ist; if (aktiv) tD += d;
    const dz = aktiv ? `<td class="n ${d < 0 ? 'neg' : 'pos'}">${d > 0 ? '+' : ''}${chf0(d)}</td>` : `<td class="n muted">–</td>`;
    return `<tr class="click" data-act="gotoMonat:${yms[i]}"><td>${MK[i]}</td><td class="n">${chf0(s.A.soll)}</td><td class="n">${aktiv || s.A.ist ? chf0(s.A.ist) : '–'}</td>${dz}<td class="n">${aktiv || s.E.ist ? chf0(s.E.ist) : '–'}</td><td class="n ${kum < 0 ? 'neg' : ''}">${chf0(kum)}</td></tr>`;
  }).join('');
  const bisYm = y === ymNow().slice(0, 4) ? ymNow() : (y < ymNow().slice(0, 4) ? `${y}-12` : null);
  const monateBis = bisYm ? yms.filter(m => m <= bisYm && m >= S.data.start) : [];
  return `<div class="card"><h2>Ausgaben pro Monat ${y}</h2>${chart}</div>
    <div class="card"><h2>Monate ${y}</h2><div class="tablewrap"><table>
    <tr><th>Monat</th><th class="n">Budget</th><th class="n">Ausgaben</th><th class="n">Abw.</th><th class="n">Einnahmen</th><th class="n">Saldo kum.</th></tr>${rows}
    <tr class="sum"><td>Total</td><td class="n">${chf0(tAs)}</td><td class="n">${chf0(tA)}</td><td class="n ${tD < 0 ? 'neg' : 'pos'}">${tD > 0 ? '+' : ''}${chf0(tD)}</td><td class="n">${chf0(tE)}</td><td class="n ${kum < 0 ? 'neg' : ''}">${chf0(kum)}</td></tr></table></div>
    <p class="muted">Abweichung nur für Monate seit Beginn der Erfassung (${esc(ymLabel(S.data.start))}) bis heute. Budget Einnahmen Jahr: ${chf0(tEs)} CHF. Tippe auf einen Monat für Details.</p></div>` +
    jahrTabelle('A', y) + jahrTabelle('E', y);
}

function jahrTabelle(typ, y) {
  const anteil = sollAnteil(y);
  let tb = 0, ti = 0;
  const istJ = id => S.data.buchungen.reduce((s, b) => s + (b.kontoId === id && b.datum.startsWith(y) ? b.betrag : 0), 0);
  const rows = kontenTyp(typ).map(k => {
    const bud = jahresBudget(k, y), ist = istJ(k.id); tb += bud; ti += ist;
    if (!bud && !ist) return '';
    const rest = typ === 'A' ? bud - ist : ist - bud;
    return `<tr class="click" data-act="kontoBuch:${k.id}"><td><span class="dot ${ampel(typ, bud * anteil, ist)}"></span>${esc(k.name)}</td><td class="n">${chf0(bud)}</td><td class="n">${chf0(ist)}</td><td class="n">${bud ? Math.round(ist / bud * 100) + '%' : '–'}</td><td class="n ${rest < 0 ? 'neg' : ''}">${chf0(rest)}</td></tr>`;
  }).join('');
  const rest = typ === 'A' ? tb - ti : ti - tb;
  return `<div class="card"><h2>${typ === 'A' ? 'Ausgaben' : 'Einnahmen'} pro Konto ${y}</h2><div class="tablewrap"><table>
    <tr><th>Konto</th><th class="n">Budget Jahr</th><th class="n">Ist</th><th class="n">%</th><th class="n">${typ === 'A' ? 'Rest' : 'Diff.'}</th></tr>${rows || '<tr><td colspan="5" class="muted">Noch kein Budget und keine Buchungen.</td></tr>'}
    <tr class="sum"><td>Total</td><td class="n">${chf0(tb)}</td><td class="n">${chf0(ti)}</td><td class="n">${tb ? Math.round(ti / tb * 100) + '%' : '–'}</td><td class="n ${rest < 0 ? 'neg' : ''}">${chf0(rest)}</td></tr></table></div>
    <p class="muted">Soll bis heute: ${Math.round(anteil * 100)}% des Jahresbudgets${S.data.start.startsWith(y) && S.data.start > y + '-01' ? ' (gezählt ab Beginn der Erfassung im ' + MONATE[+S.data.start.slice(5) - 1] + ')' : ''}. Die Ampel vergleicht das Ist damit.</p></div>`;
}

// Namensregel: Buchhaltung_<Name>, z. B. Buchhaltung_Brigitte
function repoName(name) {
  return 'Buchhaltung_' + String(name || 'Neu').trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue')
    .replace(/\s+/g, '_').replace(/[^\w.-]/g, '');
}
function vorschlagRepo(name) { return LS.get('budget.ghuser', 'pasaruwa-bit') + '/' + repoName(name); }

/* ---------- Bottom-Sheet ---------- */
function sheet(html, onBind) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  const close = () => bg.remove();
  onBind && onBind(bg.querySelector('.sheet'), close);
  return close;
}

/* ---------- Aktionen ---------- */
/* ---------- Protokoll ---------- */
// Jede Änderung wird lokal gesammelt und beim Abgleich an protokoll/JJJJ-MM.jsonl im Repository angehängt.
function geraet() {
  const ua = navigator.userAgent;
  const os = /Android/i.test(ua) ? 'Android' : /iPhone|iPad/i.test(ua) ? 'iPhone' : /Windows/i.test(ua) ? 'Windows' : /Mac/i.test(ua) ? 'Mac' : 'Gerät';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
  return (os + ' ' + br).trim();
}
function protokoll(aktion, eintrag) {
  const q = LS.get('budget.log.' + S.aktiv, []);
  q.push({ zeit: new Date().toISOString(), wer: S.ich || '(ohne Namen)', geraet: geraet(), aktion, ...eintrag });
  LS.set('budget.log.' + S.aktiv, q);
}
const logBuchung = (b, extra = {}) => { const k = konto(b.kontoId) || {}; return { objekt: 'Buchung', id: b.id, datum: b.datum, konto: (k.nr ? k.nr + ' ' : '') + (k.name || ''), text: b.text || '', beleg: !!b.beleg, ...extra }; };
function neueBuchung(f, extra = {}) {
  const b = { id: uid(), ...f, von: S.ich || '', u: now(), ...extra };
  S.data.buchungen.push(b);
  protokoll('neu', logBuchung(b, { betrag_neu: b.betrag }));
  speichere();
  return b;
}
const AKT = {
  tab: t => { S.nurFehlend = false; zeige(t); },
  fehlend: () => { S.nurFehlend = true; S.suche = ''; zeige('buchungen'); },
  alleZeigen: () => { S.nurFehlend = false; render(); },
  filter: (_, el) => { S.filterKonto = el.value; render(); },
  aw: a => { S.auswertung = a; render(); },
  gotoMonat: ym => { S.ym = ym; S.auswertung = 'monat'; render(); },
  kontoBuch: id => { S.filterKonto = id; zeige('buchungen'); },
  neuSpeichern: async () => {
    const root = document.getElementById('view');
    const f = leseForm(root); if (!f) return;
    const teile = teileLesen(root); if (!teile) return;
    const summeT = Math.round(teile.reduce((s, t) => s + t.betrag, 0) * 100) / 100;
    if (summeT > f.betrag + 0.005) { toast('Die Teile sind zusammen grösser als der Gesamtbetrag.'); return; }
    const d = aehnlicheBuchung(f);
    if (d && !confirm(`Möglicherweise schon erfasst:\n${fmtDate(d.datum)} · ${d.text || (konto(d.kontoId) || {}).name || ''} · ${chf(d.betrag)} CHF\n\nTrotzdem speichern?`)) return;
    const extra = {};
    if (!S.formBeleg) {
      const k = [f.kontoId, ...teile.map(t => t.kontoId)].map(konto).find(belegNoetig);
      if (k) { const w = await belegFrage(k); if (!w) return; Object.assign(extra, w); }
    }
    if (S.formBeleg) { try { extra.beleg = await speichereBeleg(S.formBeleg, f.datum); } catch (e) { toast('Beleg konnte nicht gespeichert werden: ' + e.message); return; } }
    S.formBeleg = null;
    if (teile.length) {
      extra.gruppe = uid();
      const h = neueBuchung({ ...f, betrag: Math.round((f.betrag - summeT) * 100) / 100 }, extra);
      for (const t of teile) neueBuchung({ betrag: t.betrag, datum: f.datum, kontoId: t.kontoId, text: [f.text, t.text].filter(Boolean).join(': ') || 'Teil' }, { ...extra, teilVon: h.id });
      toast(`Gespeichert ✓ (aufgeteilt auf ${teile.length + 1} Buchungen)`);
    } else { neueBuchung(f, extra); toast('Gespeichert ✓'); }
    S.ym = ymOf(f.datum); zeige('start');
  },
  edit: id => {
    const b = S.data.buchungen.find(x => x.id === id); if (!b) return;
    S.formBeleg = null;
    sheet(`<h2>Buchung bearbeiten</h2>${belegBoxHtml()}<div id="fHolder">${formBuchung(b)}</div>
      ${b.fixMonat ? `<p class="muted">Fester Posten ${esc(ymLabel(b.fixMonat))}</p>` : ''}
      ${b.belegFehlt && !b.beleg ? `<p class="neg">⚠ Beleg fehlt noch. Oben fotografieren oder Bild wählen, dann Speichern.</p>` : ''}
      ${b.ohneBeleg && !b.beleg ? `<p class="muted">Ohne Beleg gespeichert: ${esc(b.ohneBeleg)}</p>` : ''}
      ${b.gruppe ? `<p class="muted">⇄ Teil eines aufgeteilten Belegs. Die anderen Teile bleiben beim Ändern unverändert.</p>` : ''}
      ${b.von ? `<p class="muted">Erfasst von ${esc(b.von)}</p>` : ''}
      <div class="btns" style="margin-top:16px"><button class="btn" id="sv">Speichern</button><button class="btn sec" id="cx">Abbrechen</button><button class="btn danger" id="dl">Löschen</button></div>`,
      (root, close) => {
        bindTypSeg(root, b); bindBeleg(root, b);
        root.querySelector('#cx').onclick = close;
        root.querySelector('#sv').onclick = async () => {
          const f = leseForm(root); if (!f) return;
          if (S.formBeleg) { try { f.beleg = await speichereBeleg(S.formBeleg, f.datum); } catch (e) { return toast('Beleg konnte nicht gespeichert werden: ' + e.message); } S.formBeleg = null; }
          if (f.beleg) {
            delete b.belegFehlt; delete b.ohneBeleg;
            // Nachgereichter Beleg gilt für alle Teile eines aufgeteilten Belegs
            if (b.gruppe) for (const x of S.data.buchungen) if (x.gruppe === b.gruppe && x !== b && !x.beleg) { x.beleg = f.beleg; delete x.belegFehlt; delete x.ohneBeleg; x.u = now(); }
          }
          const alt = { betrag: b.betrag, datum: b.datum, kontoId: b.kontoId, text: b.text };
          Object.assign(b, f, { u: now() });
          const geaendert = Object.keys(alt).filter(x => alt[x] !== b[x]);
          if (geaendert.length || f.beleg) protokoll('geändert', logBuchung(b, { betrag_alt: alt.betrag, betrag_neu: b.betrag, felder: geaendert.concat(f.beleg ? ['beleg'] : []).join(', ') }));
          speichere(); close(); render(); toast('Gespeichert ✓');
        };
        root.querySelector('#dl').onclick = () => {
          if (!confirm('Buchung wirklich löschen?')) return;
          protokoll('gelöscht', logBuchung(b, { betrag_alt: b.betrag }));
          S.data.buchungen = S.data.buchungen.filter(x => x.id !== id); S.data.geloescht[id] = now(); speichere(); close(); render(); toast('Gelöscht');
        };
      });
  },
  fixOk: id => {
    const k = konto(id), ym = S.ym, betrag = fixBetrag(k);
    const datum = `${ym}-${pad(Math.min(k.tag || 1, 28))}`;
    if (k.fix === 'fix' && betrag) { neueBuchung({ betrag, datum, kontoId: k.id, text: k.name }, { fixKonto: k.id, fixMonat: ym }); render(); toast(`${k.name} bestätigt ✓`); return; }
    sheet(`<h2>${esc(k.name)}</h2><p class="muted">${betrag ? 'Üblich ' + chf(betrag) + ' CHF. ' : ''}Trage den effektiven Betrag ein.</p>
      <label for="vB">Betrag CHF</label><input id="vB" inputmode="decimal" value="${betrag || ''}">
      ${k.fix === 'fix' && !betrag ? '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="vMerk" style="width:auto" checked> Betrag für die nächsten Monate merken</label>' : ''}
      <label for="vD">Datum</label><input id="vD" type="date" value="${datum}">
      <div class="btns" style="margin-top:16px"><button class="btn" id="ok">Bestätigen</button><button class="btn sec" id="cx">Abbrechen</button></div>`,
      (root, close) => {
        const inp = root.querySelector('#vB'); inp.focus(); inp.select();
        root.querySelector('#cx').onclick = close;
        root.querySelector('#ok').onclick = () => {
          const b = parseBetrag(inp.value); if (b == null) return toast('Bitte einen gültigen Betrag eingeben.');
          const merk = root.querySelector('#vMerk'); if (merk && merk.checked) { k.fixBetrag = b; k.u = now(); }
          neueBuchung({ betrag: b, datum: root.querySelector('#vD').value || datum, kontoId: k.id, text: k.name }, { fixKonto: k.id, fixMonat: ym });
          close(); render(); toast(`${k.name} bestätigt ✓`);
        };
      });
  },
  fixSkip: id => {
    const k = konto(id);
    if (!confirm(`${k.name} entfällt in ${ymLabel(S.ym)}?`)) return;
    neueBuchung({ betrag: 0, datum: `${S.ym}-${pad(Math.min(k.tag || 1, 28))}`, kontoId: k.id, text: k.name + ' (entfällt)' }, { fixKonto: k.id, fixMonat: S.ym });
    render();
  },
  fixAlle: () => {
    const ym = S.ym, liste = offeneFixposten(ym).filter(k => k.fix === 'fix' && fixBetrag(k));
    if (!confirm(`${liste.length} feste Posten mit ihrem Monatsbetrag bestätigen?`)) return;
    for (const k of liste) { const b = { id: uid(), betrag: fixBetrag(k), datum: `${ym}-${pad(Math.min(k.tag || 1, 28))}`, kontoId: k.id, text: k.name, von: S.ich || '', u: now(), fixKonto: k.id, fixMonat: ym };
      S.data.buchungen.push(b); protokoll('neu', logBuchung(b, { betrag_neu: b.betrag, felder: 'fester Posten' })); }
    speichere(); render(); toast(`${liste.length} Posten bestätigt ✓`);
  },
  setName: (_, el) => { mandant().name = el.value.trim() || 'Buchhaltung'; speichereMandanten(); aktualisiereKopf(); },
  setIch: (_, el) => { S.ich = el.value.trim(); LS.set('budget.ich', S.ich); },
  kontoEdit: id => kontoSheet(id === 'neu' ? null : konto(id)),
  installieren: () => installieren(),
  jahrBudget: y => jahrBudgetSheet(y),
  mandantNeu: () => mandantNeu(),
  mandantLoeschen: () => {
    const m = mandant();
    if (!confirm(`„${m.name}“ von diesem Gerät entfernen?${m.repo ? ' Die Daten im GitHub-Repository bleiben erhalten.' : ' ACHTUNG: Ohne GitHub-Abgleich sind die Daten danach weg.'}`)) return;
    LS.del('budget.data.' + m.id); LS.del('budget.token.' + m.id);
    S.mandanten = S.mandanten.filter(x => x.id !== m.id); S.aktiv = S.mandanten[0].id; speichereMandanten(); ladeDaten(); render();
  },
  ghSpeichern: async () => {
    const m = mandant();
    const repo = document.getElementById('sRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
    const token = document.getElementById('sToken').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return toast('Repository bitte als Benutzer/Name angeben.');
    if (!token) return toast('Bitte den Zugangsschlüssel eintragen.');
    LS.set('budget.ghuser', repo.split('/')[0]);
    if (!S.data.buchungen.length) m.uebernehmen = true; // leere Buchhaltung: vorhandene GitHub-Daten 1:1 übernehmen
    m.repo = repo; m.dirty = true; LS.set('budget.token.' + m.id, token); speichereMandanten();
    await sync(true); render();
  },
  ghTrennen: () => { const m = mandant(); if (!confirm('GitHub-Abgleich für diese Buchhaltung ausschalten? Die Daten bleiben auf diesem Gerät.')) return; m.repo = ''; LS.del('budget.token.' + m.id); speichereMandanten(); render(); },
  csv: () => {
    const y = S.ym.slice(0, 4);
    const rows = [['Datum', 'Konto-Nr', 'Konto', 'Art', 'Betrag', 'Text', 'Erfasst von']];
    S.data.buchungen.filter(b => b.datum.startsWith(y)).sort((a, b) => a.datum.localeCompare(b.datum)).forEach(b => {
      const k = konto(b.kontoId) || {};
      rows.push([fmtDate(b.datum), k.nr || '', k.name || '', k.typ === 'E' ? 'Einnahme' : 'Ausgabe', String(b.betrag.toFixed(2)), b.text || '', b.von || '']);
    });
    const csv = '﻿' + rows.map(r => r.map(c => /[;"\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c).join(';')).join('\r\n');
    download(`Buchungen_${mandant().name}_${y}.csv`, csv, 'text/csv');
  },
  backup: () => download(`Sicherung_${mandant().name}_${todayISO()}.json`, JSON.stringify(S.data, null, 1), 'application/json'),
  restore: () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => {
      try {
        const d = JSON.parse(await i.files[0].text());
        if (!Array.isArray(d.konten) || !Array.isArray(d.buchungen)) throw new Error('keine gültige Sicherung');
        if (!confirm(`Sicherung mit ${d.buchungen.length} Buchungen einlesen? Die aktuellen Daten dieser Buchhaltung werden ersetzt.`)) return;
        S.data = migriere({ geloescht: {}, ...d }); protokoll('Sicherung eingelesen', { objekt: 'Buchhaltung', text: d.buchungen.length + ' Buchungen' }); speichere(); render(); toast('Sicherung eingelesen ✓');
      } catch (e) { toast('Fehler: ' + e.message); }
    };
    i.click();
  }
};

function kontoSheet(k) {
  const neu = !k;
  k = k || { nr: '', name: '', typ: 'A', jahre: {}, fixBetrag: null, fix: '', tag: 1 };
  const y = S.ym.slice(0, 4), jb = (k.jahre || {})[y];
  sheet(`<h2>${neu ? 'Neues Konto' : 'Konto bearbeiten'}</h2>
    <div class="seg" id="kTyp"><button type="button" data-typ="A" class="${k.typ === 'A' ? 'on' : ''}">Ausgabe</button><button type="button" data-typ="E" class="${k.typ === 'E' ? 'on' : ''}">Einnahme</button></div>
    <div class="grid2"><div><label for="kNr">Nummer</label><input id="kNr" value="${esc(k.nr)}" inputmode="numeric"></div>
    <div><label for="kBud">Budget Jahr ${y} (CHF)</label><input id="kBud" inputmode="decimal" value="${jb != null ? jb : ''}" placeholder="${jahresBudget(k, y) ? chf0(jahresBudget(k, y)) : 'leer'}"></div></div>
    <label for="kName">Name</label><input id="kName" value="${esc(k.name)}">
    <label for="kFix">Fester Posten (kommt jeden Monat zum Bestätigen)</label>
    <select id="kFix"><option value="">Nein</option><option value="fix" ${k.fix === 'fix' ? 'selected' : ''}>Ja, fix (Betrag immer gleich)</option><option value="variabel" ${k.fix === 'variabel' ? 'selected' : ''}>Ja, variabel (Betrag eintragen, z. B. Lohn)</option></select>
    <label for="kBel">Beleg nötig (bei Ausgaben)</label>
    <select id="kBel"><option value="1" ${belegNoetig({ typ: 'A', ...k }) ? 'selected' : ''}>Ja, beim Erfassen nachfragen</option><option value="0" ${belegNoetig({ typ: 'A', ...k }) ? '' : 'selected'}>Nein</option></select>
    <div class="grid2"><div><label for="kFB">Betrag pro Monat</label><input id="kFB" inputmode="decimal" value="${k.fixBetrag != null ? k.fixBetrag : ''}" placeholder="leer"></div>
    <div><label for="kTag">Fällig am Tag</label><input id="kTag" type="number" min="1" max="28" value="${k.tag || 1}"></div></div>
    <p class="muted">Der Monatsbetrag wird nur bei festen Posten zum Bestätigen vorgeschlagen.</p>
    <div class="btns" style="margin-top:16px"><button class="btn" id="sv">Speichern</button><button class="btn sec" id="cx">Abbrechen</button>
    ${neu ? '' : '<button class="btn danger" id="dl">Löschen</button>'}</div>`,
    (root, close) => {
      let typ = k.typ;
      root.querySelectorAll('#kTyp button').forEach(b => b.onclick = () => { typ = b.dataset.typ; root.querySelectorAll('#kTyp button').forEach(x => x.classList.toggle('on', x === b)); });
      root.querySelector('#cx').onclick = close;
      root.querySelector('#sv').onclick = () => {
        const name = root.querySelector('#kName').value.trim();
        if (!name) return toast('Bitte einen Namen eingeben.');
        const bv = root.querySelector('#kBud').value.trim(), fv = root.querySelector('#kFB').value.trim();
        const budget = bv === '' ? null : parseBetrag(bv), fb = fv === '' ? null : parseBetrag(fv);
        if (bv !== '' && budget == null) return toast('Budget ungültig.');
        if (fv !== '' && fb == null) return toast('Monatsbetrag ungültig.');
        const jahre = { ...(k.jahre || {}) }; if (budget == null) delete jahre[y]; else jahre[y] = budget;
        const upd = { nr: root.querySelector('#kNr').value.trim(), name, typ, jahre, fixBetrag: fb, fix: root.querySelector('#kFix').value,
          tag: Math.max(1, Math.min(28, +root.querySelector('#kTag').value || 1)), beleg: typ === 'A' && root.querySelector('#kBel').value === '1', aktiv: true, u: now() };
        const altB = neu ? undefined : (k.jahre || {})[y];
        if (neu) S.data.konten.push({ id: uid(), ...upd }); else Object.assign(k, upd);
        protokoll(neu ? 'neu' : 'geändert', { objekt: 'Konto', konto: upd.nr + ' ' + name, jahr: y, betrag_alt: altB ?? null, betrag_neu: budget });
        speichere(); close(); render(); toast('Konto gespeichert ✓');
      };
      const dl = root.querySelector('#dl');
      if (dl) dl.onclick = () => {
        const n = S.data.buchungen.filter(b => b.kontoId === k.id).length;
        if (!confirm(n ? `Das Konto hat ${n} Buchungen. Es wird ausgeblendet, die Buchungen bleiben erhalten.` : 'Konto löschen?')) return;
        protokoll('gelöscht', { objekt: 'Konto', konto: k.nr + ' ' + k.name });
        if (n) { k.aktiv = false; k.u = now(); } else { S.data.konten = S.data.konten.filter(x => x.id !== k.id); S.data.geloescht[k.id] = now(); }
        speichere(); close(); render();
      };
    });
}

function jahrBudgetSheet(y) {
  y = String(y || S.ym.slice(0, 4)); const vj = String(+y - 1);
  const zeile = k => { const v = (k.jahre || {})[y];
    return `<div class="row" style="margin:6px 0"><label for="jb_${k.id}" style="margin:0;flex:1;color:var(--text)">${esc(k.name)}</label>
      <input id="jb_${k.id}" data-id="${k.id}" inputmode="decimal" style="width:120px;text-align:right" value="${v != null ? v : ''}" placeholder="${jahresBudget(k, y) ? chf0(jahresBudget(k, y)) : '0'}"></div>`; };
  sheet(`<h2>Jahresbudget ${y}</h2><p class="muted">Betrag fürs ganze Jahr in CHF. Leer = kein Budget${Object.values(S.data.konten).some(k => Object.keys(k.jahre || {}).some(x => x < y)) ? ' (grau: Wert vom Vorjahr wird übernommen)' : ''}.</p>
    <div class="btns"><button class="btn sec sm" id="jbVJ">Budget ${vj} übernehmen</button></div>
    <h3 style="margin-top:12px">Ausgaben</h3>${kontenTyp('A').map(zeile).join('')}
    <div class="row" style="margin:8px 0;font-weight:700"><span>Total Ausgaben</span><span id="jbTA" class="num"></span></div>
    <h3 style="margin-top:12px">Einnahmen</h3>${kontenTyp('E').map(zeile).join('')}
    <div class="row" style="margin:8px 0;font-weight:700"><span>Total Einnahmen</span><span id="jbTE" class="num"></span></div>
    <div class="btns" style="margin-top:16px"><button class="btn" id="sv">Speichern</button><button class="btn sec" id="cx">Abbrechen</button></div>`,
    (root, close) => {
      const totale = () => {

const b64enc = s => { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };

function merge(lokal, remote) {
  const geloescht = { ...(remote.geloescht || {}), ...(lokal.geloescht || {}) };
  const mergeArr = (a = [], b = []) => {
    const map = new Map();
    for (const x of [...b, ...a]) { const y = map.get(x.id); if (!y || (x.u || 0) >= (y.u || 0)) map.set(x.id, x); }
    return [...map.values()].filter(x => !geloescht[x.id]);

  const konten = mergeArr(lokal.konten, remote.konten), buchungen = mergeArr(lokal.buchungen, remote.buchungen);
  // Gleiche Konten (Typ + Nummer + Name) mit verschiedenen IDs zusammenführen, z. B. wenn ein Gerät mit
  // eigener Vorlage gestartet ist. Behalten wird das Konto mit Budget, die Buchungen werden umgehängt.
  const gruppen = new Map();
  for (const k of konten) { const key = `${k.typ}|${String(k.nr).trim()}|${String(k.name).trim().toLowerCase()}`; (gruppen.get(key) || gruppen.set(key, []).get(key)).push(k); }
  const ersetzt = {};
  for (const g of gruppen.values()) {
    if (g.length < 2) continue;
    g.sort((a, b) => (Object.keys(b.jahre || {}).length - Object.keys(a.jahre || {}).length) || ((b.fixBetrag ? 1 : 0) - (a.fixBetrag ? 1 : 0)) || ((b.u || 0) - (a.u || 0)));
    for (const k of g.slice(1)) { ersetzt[k.id] = g[0].id; geloescht[k.id] = now(); }
  }
  for (const b of buchungen) { if (ersetzt[b.kontoId]) { b.kontoId = ersetzt[b.kontoId]; b.u = now(); } if (ersetzt[b.fixKonto]) b.fixKonto = ersetzt[b.fixKonto]; }

}

async function sync(laut) {

  const url = `https://api.github.com/repos/${m.repo}/contents/data.json`;
  const hdr = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  const mId = m.id;
  try {
    for (let versuch = 0; versuch < 3; versuch++) {
      const r = await fetch(url + '?t=' + now(), { headers: hdr, cache: 'no-store' });
      let remote = null, sha;
      if (r.status === 200) { const j = await r.json(); sha = j.sha; remote = migriere(JSON.parse(b64dec(j.content))); }
      else if (r.status === 404) {

        if (rr.status === 404) throw new Error('Repository nicht gefunden oder kein Zugriff. Prüfe Name und Token.');
        if (rr.ok && !(await rr.json()).private) throw new Error('Das Repository ist öffentlich! Bitte auf „Private“ stellen, sonst kann jeder deine Daten sehen.');
      }
      else if (r.status === 401) throw new Error('Zugangsschlüssel ungültig oder abgelaufen.');
      else if (r.status === 403) throw new Error('Kein Zugriff (403). Hat der Token Schreibrechte auf „Contents“?');
      else throw new Error('GitHub antwortet mit Fehler ' + r.status);
      if (S.aktiv !== mId) return;
      const lokal = migriere(LS.get('budget.data.' + mId, S.data));
      const neu = remote ? (m.uebernehmen ? merge(remote, remote) : merge(lokal, remote)) : lokal;
      const unveraendert = remote && JSON.stringify({ ...neu, u: 0 }) === JSON.stringify({ ...merge(remote, remote), u: 0 });
      if (!unveraendert) {
        const body = { message: `Budget-App: Abgleich ${new Date().toLocaleString('de-CH')}${S.ich ? ' (' + S.ich + ')' : ''}`, content: b64enc(JSON.stringify(neu, null, 1)) };
        if (sha) body.sha = sha;
        const p = await fetch(url, { method: 'PUT', headers: { ...hdr, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (p.status === 409 || p.status === 422) continue; // jemand anderes hat gleichzeitig gespeichert: nochmals
        if (!p.ok) throw new Error(p.status === 403 || p.status === 404 ? 'Keine Schreibrechte. Token braucht „Contents: Read and write“.' : 'Speichern auf GitHub fehlgeschlagen (' + p.status + ')');
      }
      S.data = neu; LS.set('budget.data.' + mId, neu);
      await ladeBelegeHoch(m, hdr);
      await ladeProtokollHoch(m, hdr);

    }

// Beleg (helles Papier) im Bild finden. Ergebnis: Rechteck in Anteilen 0..1 oder null
function findeBeleg(quelle) {

// Betrag, Datum und Geschäft aus dem erkannten Text herauslesen
function leseBeleg(text) {
  const zeilen = text.split(/\r?\n/).map(z => z.trim()).filter(Boolean);
  const betragRe = /(\d{1,3}(?:['’`´ ]\d{3})+|\d+)\s?[.,]\s?(\d{2})(?![\d%])/g;
  const totalRe = /(total|summe|zu\s*zahlen|zahlbetrag|endbetrag|gesamt|betrag\s*chf|rechnungsbetrag)/i;
  const ausRe = /(mwst|mws|ust|rückgeld|ruckgeld|retour|zurück|rabatt|gegeben|satz|netto|%)/i;
  const kand = [];

  zeilen.forEach((z, i) => {

      const v = parseFloat(m[1].replace(/['’`´ ]/g, '') + '.' + m[2]);

      const vor = z.slice(0, m.index), nach = z.slice(m.index + m[0].length);
      const letzte = re => { let x = -1; for (const t of vor.matchAll(re)) x = t.index; return x; };
      const lc = letzte(/chf|sfr|\bfr\b/gi), le = letzte(/eur|€/gi);
      let cur = lc > le ? 'chf' : le > lc ? 'eur' : (chfRe.test(nach.slice(0, 6)) ? 'chf' : eurRe.test(nach.slice(0, 6)) ? 'eur' : '');

  LS.set('budget.ghuser', e.r.split('/')[0]);
  S.aktiv = md.id; speichereMandanten(); ladeDaten();
  toast('Buchhaltung eingerichtet, Daten werden geladen…');
  return true;
}

/* ---------- Auf den Startbildschirm ---------- */
// Ein Browser darf das Symbol nie ohne Zustimmung anlegen. Android/Chrome: ein Tipp auf „Installieren“ genügt.
// iPhone/Safari kennt das nicht, dort zeigen wir die zwei Schritte.
let installPrompt = null;
const istInstalliert = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const istIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; zeigeInstallHinweis(); });
window.addEventListener('appinstalled', () => { installPrompt = null; document.getElementById('installBar')?.remove(); toast('Symbol auf dem Startbildschirm angelegt ✓'); });
async function installieren() {
  if (installPrompt) {
    installPrompt.prompt();
    const w = await installPrompt.userChoice.catch(() => null);
    installPrompt = null; document.getElementById('installBar')?.remove();
    if (w && w.outcome === 'accepted') toast('Wird auf den Startbildschirm gelegt…');
    return;
  }
  const ios = istIOS;
  sheet(`<h2>Symbol auf den Startbildschirm</h2>${ios ? `
    <ol class="schritte"><li>Unten in Safari auf <b>Teilen</b> tippen (Quadrat mit Pfeil nach oben ⬆).</li><li><b>Zum Home-Bildschirm</b> wählen (evtl. etwas nach unten wischen).</li><li>Oben rechts <b>Hinzufügen</b>.</li></ol>
    <p class="muted">Wichtig: Das geht nur in Safari, nicht in Chrome auf dem iPhone.</p>` : `
    <ol class="schritte"><li>Oben rechts in Chrome auf <b>⋮</b> tippen.</li><li><b>Zum Startbildschirm hinzufügen</b> oder <b>App installieren</b> wählen.</li><li><b>Installieren</b> bestätigen.</li></ol>`}
    <div class="btns" style="margin-top:12px"><button class="btn" id="cx">Verstanden</button></div>`, (root, close) => root.querySelector('#cx').onclick = close);
}
function zeigeInstallHinweis(trotzdem) {
  if (istInstalliert() || location.protocol === 'file:' || document.getElementById('installBar')) return;
  if (!trotzdem && LS.get('budget.installSpaeter', 0) > Date.now()) return;
  if (!installPrompt && !istIOS && !trotzdem) return;
  const bar = document.createElement('div'); bar.id = 'installBar'; bar.className = 'installbar';
  bar.innerHTML = `<span>📲 Budget-App als Symbol auf den Startbildschirm legen?</span><div class="btns"><button class="btn sm" id="iJa">${installPrompt ? 'Installieren' : 'So geht’s'}</button><button class="btn sec sm" id="iNein">Später</button></div>`;
  document.body.appendChild(bar);
  bar.querySelector('#iJa').onclick = installieren;
  bar.querySelector('#iNein').onclick = () => { LS.set('budget.installSpaeter', Date.now() + 7 * 864e5); bar.remove(); };
}

/* ---------- Hilfen ---------- */
let toastT;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

init();

</script>
</body>
